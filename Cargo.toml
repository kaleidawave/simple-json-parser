[package]
name = "simple-json-parser"
version = "0.0.5"
edition = "2021"
description = "No allocation JSON key-value parser with comment support"
authors = ["Ben <kaleidawave@gmail.com>"]
license = "MIT"
keywords = ["json", "parser", "no-allocation", "comments"]
categories = ["parsing", "web-programming"]
repository = "https://github.com/kaleidawave/simple-json-parser"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[lib]
path = "lib.rs"

[[test]]
name = "specification"
path = "./tests/specification.rs"
harness = false

[lints.clippy]
pedantic = "deny"

[package.metadata.commands]
test = "spectra test specification.md 'cargo run --example parse -q -- --interactive --rpc'"